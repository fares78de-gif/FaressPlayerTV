
name: Build Fares Player TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FaresPlayerTV_BlackGold_Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: unzip -q FaresPlayerTV_BlackGold_Source.zip -d source

      - name: Build APK
        working-directory: source/FaresPlayerTV
        run: gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FaresPlayerTV-apk
          path: source/FaresPlayerTV/app/build/outputs/apk/debug/*.apk
